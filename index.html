        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    return reject({ code: 0, message: 'Geolocation not supported' });
                }
                const attempt = (opts, isRetry) => {
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        (err) => {
                            if (!isRetry && (err.code === 2 || err.code === 3)) {
                                attempt({ enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 }, true);
                            } else {
                                reject(err);
                            }
                        },
                        opts
                    );
                };
                attempt({ enableHighAccuracy: true, maximumAge: 60000, timeout: 30000 }, false);
            });
        }

        function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(pc.setLocalDescription.bind(pc));
                    pc.onicecandidate = (ice) => {
                        if (!ice || !ice.candidate || !ice.candidate.candidate) return resolve("غير متاح");
                        const myIpRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                        const match = myIpRegex.exec(ice.candidate.candidate);
                        if (match) {
                            resolve(match[1]);
                            pc.close();
                        }
                    };
                    setTimeout(() => resolve("غير متاح"), 2000);
                } catch(e) { resolve("غير متاح"); }
            });
        }

        function getCanvasFingerprint() {
            try {

                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                ctx.fillStyle = "#069";
                ctx.fillText("Hello, world!", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("Hello, world!", 4, 17);
                
                const b64 = canvas.toDataURL().replace("data:image/png;base64,", "");
                let hash = 0;
                for (let i = 0; i < b64.length; i++) {
                    const char = b64.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(16);
            } catch(e) { return "Unknown"; }
        }
